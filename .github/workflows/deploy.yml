name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Mercado Hoje: de hora em hora (:11) todos os dias e também no :41 nos dias úteis das 09:41 às
    # 21:41 BRT, ou seja, a cada 30 min das 09:11 às 22:11 BRT. Minutos quebrados para não cair junto
    # do topo da hora nem dos crons dos subprojetos (monitor-b3 :04/:34, rrg :07, setores :09/:23/:39,
    # hmm-regimes :13, pairs-trading :17). O GitHub pode atrasar execuções agendadas.
    # Um workflow só de dados não daria: o deploy do Pages troca o artefato inteiro do site.
    - cron: '11 * * * *'           # todo dia, de hora em hora (UTC = BRT + 3)
    - cron: '41 12-23 * * 1-5'     # seg–sex 09:41–20:41 BRT
    - cron: '41 0 * * 2-6'         # seg–sex 21:41 BRT (00:41 UTC do dia seguinte)
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci
      - run: npm run sync-books
      - run: npm run sync-second-brain
      # Mercado Hoje: Selic, CDI, IPCA e PTAX do Banco Central (SGS) via python-bcb, depois junta
      # os data/summary.json dos subprojetos. Os dois passos nunca derrubam o deploy (fallback por bloco).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-bcb.txt
      - run: pip install -r scripts/requirements-bcb.txt
      - run: python scripts/fetch_bcb.py .cache/bcb-sgs.json
      - run: npm run sync-mercado-hoje
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
