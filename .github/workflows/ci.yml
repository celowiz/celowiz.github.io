name: CI

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sync-books
      - run: npm run sync-second-brain
      # Mercado Hoje: Selic, CDI, IPCA e PTAX do Banco Central (SGS) via python-bcb, depois junta
      # os data/summary.json dos subprojetos. Os dois passos nunca derrubam o deploy (fallback por bloco).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-bcb.txt
      - run: pip install -r scripts/requirements-bcb.txt
      - run: python -m unittest scripts/test_fetch_bcb.py
      - run: python scripts/fetch_bcb.py .cache/bcb-sgs.json
      - run: npm run sync-mercado-hoje
      - run: npm run build
