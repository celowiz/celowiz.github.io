name: CI

on:
  pull_request:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sync-books
      - run: npm run sync-second-brain
      # Mercado Hoje: Selic, CDI, IPCA e PTAX do Banco Central (SGS) via python-bcb, depois junta
      # os data/summary.json dos subprojetos. Os dois passos nunca derrubam o deploy (fallback por bloco).
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-bcb.txt
      - run: pip install -r scripts/requirements-bcb.txt
      - run: python -m unittest scripts/test_fetch_bcb.py
      - run: python scripts/fetch_bcb.py .cache/bcb-sgs.json
      - run: npm run sync-mercado-hoje
      - run: npm run build
